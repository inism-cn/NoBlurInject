name: Build NoBlurInject dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      THEOS: /home/runner/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git make fakeroot perl unzip xz-utils lzma libncurses5

      - name: Clone theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS

      - name: Download & install clang toolchain (Linux -> iOS arm64e)
        run: |
          curl -fL --retry 3 -o /tmp/toolchain.tar.lzma \
            "https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma"
          FILESIZE=$(stat -c %s /tmp/toolchain.tar.lzma)
          echo "Toolchain size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 1000000 ]; then
            echo "❌ Toolchain download failed"
            exit 1
          fi
          TMP=$(mktemp -d)
          tar --lzma -xvf /tmp/toolchain.tar.lzma -C $TMP
          mkdir -p $THEOS/toolchain/linux/iphone
          cp -r $TMP/ios-arm64e-clang-toolchain/. $THEOS/toolchain/linux/iphone/
          echo "✅ Toolchain installed"

      - name: Download iPhoneOS14.5 SDK (official)
        run: |
          mkdir -p $THEOS/sdks
          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS14.5.sdk.tar.xz"
          echo "Downloading: $SDK_URL"
          curl -fL --retry 3 -o /tmp/iOS14.5.sdk.tar.xz "$SDK_URL"
          FILESIZE=$(stat -c %s /tmp/iOS14.5.sdk.tar.xz)
          echo "SDK size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 1000000 ]; then
            echo "❌ SDK download failed"
            exit 1
          fi
          tar -xJf /tmp/iOS14.5.sdk.tar.xz -C $THEOS/sdks/
          echo "✅ SDK extracted:"
          ls -d $THEOS/sdks/iPhoneOS*.sdk

      - name: Install ldid
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install ldid
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      - name: Check Tweak.m for actual autorelease messages (not comments or @autoreleasepool)
        run: |
          echo "=== Checking Tweak.m for actual [something autorelease] calls ==="
          # 只匹配 [xxx autorelease] 形式，排除注释行和 @autoreleasepool
          if grep -nE '^\s*\[.*\sautorelease\]' Tweak.m; then
            echo "❌ FATAL: Tweak.m contains actual autorelease message send"
            exit 1
          fi
          echo "✅ No autorelease message sends found"

      - name: Build dylib (arm64e)
        run: |
          export THEOS=$THEOS
          export PATH="/home/linuxbrew/.linuxbrew/bin:$THEOS/toolchain/linux/iphone/bin:$PATH"
          echo "=== Pre-build checks ==="
          ls -d $THEOS/sdks/iPhoneOS*.sdk
          ls $THEOS/toolchain/linux/iphone/bin/ | head -5
          echo "========================="
          make clean
          make package FINALPACKAGE=1 THEOS_BUILD_ARCH=arm64e
          echo "=== Build artifacts ==="
          find . -name "*.dylib" -o -name "*.deb" 2>/dev/null
          ls -la packages/ 2>/dev/null
          ls -la .theos/obj/debug/ 2>/dev/null

      - name: Verify dylib output
        run: |
          echo "=== Verifying dylib output ==="
          DYLIB=$(find . -name "*.dylib" 2>/dev/null | head -1)
          if [ -z "$DYLIB" ]; then
            echo "❌ No .dylib found"
            exit 1
          fi
          FILE_OUTPUT=$(file "$DYLIB")
          echo "$FILE_OUTPUT"
          if echo "$FILE_OUTPUT" | grep -q "Mach-O"; then
            echo "✅ Valid Mach-O dylib"
          else
            echo "❌ Not a valid Mach-O file"
            exit 1
          fi

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: NoBlurInject-dylib-arm64e
          path: |
            packages/*.deb
            .theos/obj/debug/*.dylib