name: Build NoBlurInject dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      THEOS: /home/runner/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git make fakeroot perl unzip xz-utils lzma libncurses5

      - name: Clone theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS

      - name: Download toolchain (sbinger clang 10.0.0-1 — VERIFIED EXISTS)
        run: |
          curl -fL --retry 3 -o /tmp/toolchain.tar.lzma \
            "https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma"
          FILESIZE=$(stat -c %s /tmp/toolchain.tar.lzma)
          echo "Toolchain size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 1000000 ]; then echo "❌ download failed"; exit 1; fi
          TMP=$(mktemp -d)
          tar -xvf /tmp/toolchain.tar.lzma -C $TMP
          mkdir -p $THEOS/toolchain/linux/iphone
          mv $TMP/ios-arm64e-clang-toolchain/* $THEOS/toolchain/linux/iphone/
          echo "✅ Toolchain installed"

      - name: Download iPhoneOS14.5 SDK (VERIFIED EXISTS in master-146e41f)
        run: |
          mkdir -p $THEOS/sdks
          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS14.5.sdk.tar.xz"
          echo "Downloading: $SDK_URL"
          curl -fL --retry 3 -o /tmp/iOS14.5.sdk.tar.xz "$SDK_URL"
          FILESIZE=$(stat -c %s /tmp/iOS14.5.sdk.tar.xz)
          echo "SDK size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 1000000 ]; then echo "❌ SDK download failed"; exit 1; fi
          tar -xJf /tmp/iOS14.5.sdk.tar.xz -C $THEOS/sdks/
          echo "✅ SDK extracted: $(ls -d $THEOS/sdks/iPhoneOS*.sdk)"

      - name: Install ldid
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install ldid
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      - name: Build dylib (arm64e, SDK 14.5)
        run: |
          export THEOS=$THEOS
          export SDKVERSION=14.5
          export PATH="/home/linuxbrew/.linuxbrew/bin:$THEOS/toolchain/linux/iphone/bin:$PATH"
          echo "=== Pre-build ==="
          ls -d $THEOS/sdks/iPhoneOS*.sdk
          clang --version | head -1
          grep "^TARGET" Makefile
          make clean
          make package FINALPACKAGE=1 THEOS_BUILD_ARCH=arm64e SDKVERSION=14.5
          echo "=== Artifacts ==="
          find . -name "*.dylib" -o -name "*.deb" 2>/dev/null
          ls -la packages/ 2>/dev/null
          ls -la .theos/obj/debug/ 2>/dev/null

      - name: Verify dylib
        run: |
          DYLIB=$(find . -name "*.dylib" 2>/dev/null | head -1)
          if [ -z "$DYLIB" ]; then echo "❌ No dylib"; exit 1; fi
          file "$DYLIB"
          if file "$DYLIB" | grep -q "Mach-O"; then echo "✅ Valid"; else exit 1; fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NoBlurInject-dylib-arm64e
          path: |
            packages/*.deb
            .theos/obj/debug/*.dylib