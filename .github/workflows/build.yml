name: Build NoBlurInject dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git make gcc clang unzip

      - name: Install theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS SDK
        run: |
          mkdir -p $HOME/theos/sdks
          # 下载 iOS 15.0 SDK（兼容 iOS 15.2）
          curl -L -o iPhoneOS15.0.sdk.zip \
            "https://github.com/xybp888/iOS-SDKs/releases/download/v1.0/iPhoneOS15.0.sdk.zip"
          unzip -q iPhoneOS15.0.sdk.zip -d $HOME/theos/sdks/
          ls -la $HOME/theos/sdks/

      - name: Install ldid via Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      - name: Install ldid
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install ldid

      - name: Build dylib
        run: |
          export THEOS=$HOME/theos
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          
          # 只构建 arm64e（iPhone 13 mini 适用）
          make clean
          make package FINALPACKAGE=1 THEOS_BUILD_ARCH=arm64e
          
          # 查找产物
          find . -name "*.dylib" -o -name "*.deb" 2>/dev/null
          ls -la packages/ 2>/dev/null || ls -la .theos/obj/debug/ 2>/dev/null || echo "No output found"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: NoBlurInject-dylib
          path: |
            packages/*.deb
            .theos/obj/debug/*.dylib