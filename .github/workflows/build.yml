name: Build NoBlurInject dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS

      - name: Download iPhoneOS14.5 SDK (official master-146e41f)
        run: |
          mkdir -p $THEOS/sdks
          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS14.5.sdk.tar.xz"
          echo "Downloading: $SDK_URL"
          curl -fL --retry 3 -o /tmp/iOS14.5.sdk.tar.xz "$SDK_URL"
          FILESIZE=$(stat -f %z /tmp/iOS14.5.sdk.tar.xz)
          echo "SDK size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 1000000 ]; then echo "❌ SDK download failed"; exit 1; fi
          tar -xJf /tmp/iOS14.5.sdk.tar.xz -C $THEOS/sdks/
          echo "✅ SDK extracted: $(ls -d $THEOS/sdks/iPhoneOS*.sdk)"

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build dylib only (no deb package)
        run: |
          export THEOS=$THEOS
          export SDKVERSION=14.5
          echo "=== Pre-build ==="
          ls -d $THEOS/sdks/iPhoneOS*.sdk
          clang --version | head -1
          grep "^TARGET" Makefile
          echo "====================="
          # 只做 make all，不调 make package
          make clean
          make all FINALPACKAGE=1 THEOS_BUILD_ARCH=arm64e SDKVERSION=14.5
          echo "=== Build artifacts ==="
          find .theos/obj -name "*.dylib" 2>/dev/null
          ls -la .theos/obj/arm64e/ 2>/dev/null

      - name: Copy dylib to predictable path
        run: |
          mkdir -p output
          DYLIB=$(find .theos/obj -name "NoBlurInject.dylib" 2>/dev/null | head -1)
          if [ -z "$DYLIB" ]; then
            echo "❌ NoBlurInject.dylib not found"
            find .theos -type f 2>/dev/null
            exit 1
          fi
          cp "$DYLIB" output/NoBlurInject.dylib
          echo "✅ Copied to output/NoBlurInject.dylib"
          file output/NoBlurInject.dylib

      - name: Verify dylib
        run: |
          if file output/NoBlurInject.dylib | grep -q "Mach-O"; then
            echo "✅ Valid Mach-O dylib"
          else
            echo "❌ Not a valid dylib"
            exit 1
          fi

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: NoBlurInject-dylib-arm64e
          path: output/NoBlurInject.dylib