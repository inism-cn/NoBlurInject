name: Build NoBlurInject deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS

      - name: Download iPhoneOS14.5 SDK
        run: |
          mkdir -p $THEOS/sdks
          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS14.5.sdk.tar.xz"
          curl -fL --retry 3 -o /tmp/iOS14.5.sdk.tar.xz "$SDK_URL"
          tar -xJf /tmp/iOS14.5.sdk.tar.xz -C $THEOS/sdks/
          echo "✅ SDK: $(ls -d $THEOS/sdks/iPhoneOS*.sdk)"

      - name: Install ldid
        run: brew install ldid

      - name: Create DEBIAN/control for deb packaging
        run: |
          mkdir -p layout/DEBIAN
          cat > layout/DEBIAN/control <<EOF
          Package: com.yourusername.noblurinject
          Name: NoBlurInject
          Version: 1.0.0
          Architecture: iphoneos-arm64e
          Description: Remove background blur in app switcher for any app
          Maintainer: Your Name
          Author: Your Name
          Section: Tweaks
          Depends: firmware (>= 14.0)
          EOF

      - name: Build deb package
        run: |
          export THEOS=$THEOS
          export SDKVERSION=14.5
          make clean
          make package FINALPACKAGE=1 THEOS_BUILD_ARCH=arm64e SDKVERSION=14.5
          echo "=== Generated files ==="
          ls -la packages/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: NoBlurInject-deb
          path: packages/*.deb