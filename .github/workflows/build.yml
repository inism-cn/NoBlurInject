name: Build NoBlurInject dylib

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git make clang unzip xz-utils

      - name: Clone theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download & verify iOS SDK (iPhoneOS15.6)
        run: |
          mkdir -p $HOME/theos/sdks
          SDK_URL="https://github.com/theos/sdks/releases/download/SDK-Release-1/iPhoneOS15.6.sdk.tar.xz"
          echo "Downloading: $SDK_URL"
          curl -fL --retry 3 -o /tmp/iPhoneOS15.6.sdk.tar.xz "$SDK_URL"

          # 校验：文件大小应该 > 10MB（15.2 MB 左右）
          FILESIZE=$(stat -c %s /tmp/iPhoneOS15.6.sdk.tar.xz)
          echo "Downloaded file size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 1000000 ]; then
            echo "❌ ERROR: Downloaded file is too small ($FILESIZE bytes). Likely not a real SDK."
            exit 1
          fi

          # 校验：应该是 xz 压缩格式
          file /tmp/iPhoneOS15.6.sdk.tar.xz
          tar -xJf /tmp/iPhoneOS15.6.sdk.tar.xz -C $HOME/theos/sdks/
          echo "✅ SDK extracted:"
          ls -la $HOME/theos/sdks/

      - name: Download & verify clang toolchain (Linux -> iOS)
        run: |
          TOOLCHAIN_URL="https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma"
          echo "Downloading toolchain: $TOOLCHAIN_URL"
          curl -fL --retry 3 -o /tmp/toolchain.tar.lzma "$TOOLCHAIN_URL"

          FILESIZE=$(stat -c %s /tmp/toolchain.tar.lzma)
          echo "Toolchain file size: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 1000000 ]; then
            echo "❌ ERROR: Toolchain download failed ($FILESIZE bytes)"
            exit 1
          fi

          TMP=$(mktemp -d)
          tar --lzma -xvf /tmp/toolchain.tar.lzma -C $TMP
          mkdir -p $THEOS/toolchain/linux/iphone
          mv $TMP/ios-arm64e-clang-toolchain/* $THEOS/toolchain/linux/iphone/
          echo "✅ Toolchain installed:"
          ls $THEOS/toolchain/linux/iphone/bin/

      - name: Install ldid
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install ldid
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      - name: Build dylib (arm64e)
        run: |
          export THEOS=$HOME/theos
          export PATH="/home/linuxbrew/.linuxbrew/bin:$THEOS/toolchain/linux/iphone/bin:$PATH"
          export SDKVERSION=15.6

          make clean
          make package FINALPACKAGE=1 THEOS_BUILD_ARCH=arm64e

          echo "=== Build output ==="
          find . -name "*.dylib" -o -name "*.deb" 2>/dev/null
          ls -la packages/ 2>/dev/null || ls -la .theos/obj/debug/ 2>/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoBlurInject-dylib-arm64e
          path: |
            packages/*.deb
            .theos/obj/debug/*.dylib